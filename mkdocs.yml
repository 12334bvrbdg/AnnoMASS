site_name: AnnoMASS Documentation
site_description: >-
  AnnoMASS is a tiered MS/MS annotation tool for flavonoids. Install it locally,
  use the desktop GUI or the command line, or try the web version.
site_author: AnnoMASS developers
# site_url is needed for the sitemap that search engines read.
site_url: https://docs.annomass.com/
repo_url: https://github.com/12334bvrbdg/AnnoMASS
repo_name: 12334bvrbdg/AnnoMASS
edit_uri: edit/main/docs_site/

docs_dir: docs_site
site_dir: site
copyright: Copyright &copy; 2026 AnnoMASS developers

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quickstart.md
  - User guide:
      - Desktop GUI: gui.md
      - Command line (CLI): cli.md
      - Web version: web.md
      - Input and output: input-output.md
  - How it works:
      - Algorithm: algorithm.md
  - FAQ: faq.md
  - Acknowledgements: acknowledgements.md
